name: db health (daily)

on:
  schedule:
    # Todos los días a las 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger db health check
        run: |
          curl -X GET \
            -H "apikey: $SUPA_KEY" \
            -H "Authorization: Bearer $SUPA_KEY"
            https://xnroglnskuswyiqaadfb.supabase.co/rest/v1/goals?select=* \
        env:
          SUPA_KEY: ${{ secrets.SUPA_KEY }}
